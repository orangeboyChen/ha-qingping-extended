[project]
name = "qingping-screen"
version = "0.1.0"
description = "Home Assistant integration for controlling a Qingping screen over ADB"
requires-python = ">=3.12"
dependencies = [
  "adb-shell[async]>=0.4.4",
  "homeassistant>=2024.4",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
